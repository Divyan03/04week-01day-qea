# pytest.ini - Lesson: pytest-installation-and-configuration (config), markers (registering)
[pytest]
testpaths = tests
pythonpath = .
addopts = --strict-markers -ra

# TODO 1 (Task 2): register the four markers below, one per line, each with a short
# description, e.g.   smoke: fast sanity checks
# Markers to register: smoke, regression, boundary, slow
# Until you do, any test using @pytest.mark.smoke will ERROR because of --strict-markers.
markers =
    smoke: quick sanity checks, run on every build
    regression: broad checks run before releases
    slow: tests that take more than a few seconds
    boundary: use extreme ends, to catch edges of acceptable inputs